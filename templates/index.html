<!DOCTYPE html>
<html>
<head>
  <title>Dynamic Wumpus Logic Agent</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>

<h2>🧠 Dynamic Wumpus Logic Agent</h2>

<div class="controls">
  <label>Rows:</label>
  <input id="rows" type="number" value="4" min="2" max="10">
  <label>Cols:</label>
  <input id="cols" type="number" value="4" min="2" max="10">
  <button onclick="init()">🎮 Start Game</button>
  <button onclick="step()">⏭️ Next Step</button>
</div>

<div class="grid-container">
  <div id="grid"></div>
</div>

<div class="info">
  <p id="p1"></p>
  <p id="p2"></p>
  <p id="p3"></p>
</div>

<div class="legend">
  <div class="legend-item">
    <div class="legend-color" style="background: #00dd00;"></div>
    <span>Safe</span>
  </div>
  <div class="legend-item">
    <div class="legend-color" style="background: #ff0000;"></div>
    <span>Danger</span>
  </div>
  <div class="legend-item">
    <div class="legend-color" style="background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); box-shadow: 0 0 8px rgba(102, 126, 234, 0.5);"></div>
    <span>Agent</span>
  </div>
  <div class="legend-item">
    <div class="legend-color" style="background: #d3d3d3; border: 3px solid #333;"></div>
    <span>Visited</span>
  </div>
</div>

<script src="/static/script.js"></script>
</body>
</html>
